<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Quality Checker</title>
  <style>
    body {
      margin: 0;
      font: 15px/1.5 Arial, Helvetica, sans-serif;
      color: #222;
      background: #fff;
    }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 22px; font-weight: bold; margin: 0 0 6px; }
    p { margin: 0 0 20px; }
    label.file {
      display: block;
      border: 1px solid #999;
      padding: 14px;
      cursor: pointer;
    }
    label.file input { display: none; }
    .hint { color: #555; font-size: 13px; margin-top: 4px; }
    button {
      margin-top: 12px;
      padding: 8px 16px;
      font: inherit;
      border: 1px solid #222;
      background: #222;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { background: #ccc; border-color: #ccc; cursor: default; }
    #error {
      display: none;
      margin: 16px 0;
      padding: 10px;
      border: 1px solid #a00;
      color: #a00;
    }
    #results { margin-top: 24px; }
    .counts { margin: 0 0 16px; }
    .counts span { display: inline-block; margin-right: 24px; }
    .counts b { font-size: 20px; }
    h2 { font-size: 16px; margin: 0 0 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #ccc; vertical-align: top; }
    th { font-weight: bold; }
    #allgood { padding: 10px 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
<main>
  <h1>Data Quality Checker</h1>
  <p>Upload a CSV of survey records to find missing fields, bad coordinates and duplicate IDs.</p>

  <form id="form">
    <label class="file" id="drop">
      <input type="file" id="file" accept=".csv,text/csv">
      <span id="label">Choose a CSV file, or drop one here</span>
      <div class="hint">Required columns: record_id, name, district, latitude, longitude</div>
    </label>
    <button id="submit" type="submit" disabled>Check file</button>
  </form>

  <div id="error" role="alert"></div>

  <section id="results" class="hidden">
    <p class="counts">
      <span><b id="rows">0</b> rows</span>
      <span><b id="clean">0</b> clean</span>
      <span><b id="issueCount">0</b> problems</span>
    </p>
    <div id="allgood" class="hidden">No problems found.</div>
    <div id="issuesWrap" class="hidden">
      <h2>Problems</h2>
      <table>
        <thead><tr><th>Row</th><th>Column</th><th>Problem</th></tr></thead>
        <tbody id="issues"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
  const form = document.getElementById("form");
  const fileInput = document.getElementById("file");
  const drop = document.getElementById("drop");
  const label = document.getElementById("label");
  const submit = document.getElementById("submit");
  const errorBox = document.getElementById("error");
  const results = document.getElementById("results");

  function setFile(file) {
    if (!file) return;
    label.textContent = file.name + " selected";
    submit.disabled = false;
  }

  fileInput.addEventListener("change", () => setFile(fileInput.files[0]));

  ["dragenter", "dragover"].forEach(evt =>
    drop.addEventListener(evt, e => e.preventDefault()));
  drop.addEventListener("drop", e => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file) {
      const dt = new DataTransfer();
      dt.items.add(file);
      fileInput.files = dt.files;
      setFile(file);
    }
  });

  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = "block";
    results.classList.add("hidden");
  }

  function cell(text) {
    const td = document.createElement("td");
    td.textContent = text;
    return td;
  }

  function showResults(data) {
    errorBox.style.display = "none";
    document.getElementById("rows").textContent = data.rows;
    document.getElementById("clean").textContent = data.clean_rows;
    document.getElementById("issueCount").textContent = data.issues.length;

    const body = document.getElementById("issues");
    body.innerHTML = "";
    data.issues.forEach(issue => {
      const tr = document.createElement("tr");
      tr.append(cell(issue.row ?? "-"), cell(issue.column ?? "-"), cell(issue.problem));
      body.append(tr);
    });

    const none = data.issues.length === 0;
    document.getElementById("allgood").classList.toggle("hidden", !none);
    document.getElementById("issuesWrap").classList.toggle("hidden", none);
    results.classList.remove("hidden");
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const file = fileInput.files[0];
    if (!file) return;

    errorBox.style.display = "none";
    submit.disabled = true;
    submit.textContent = "Checking...";

    const body = new FormData();
    body.append("file", file);

    try {
      const response = await fetch("/validate", { method: "POST", body });
      const data = await response.json();
      if (!response.ok) {
        showError(data.detail || "The file could not be checked.");
      } else {
        showResults(data);
      }
    } catch (err) {
      showError("Could not reach the server. Check that it is running and try again.");
    } finally {
      submit.disabled = false;
      submit.textContent = "Check file";
    }
  });
</script>
</body>
</html>
