<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Quality Checker</title>
  <style>
    :root {
      --bg: #f5f7fa; --card: #ffffff; --text: #1d2433; --muted: #5b6475;
      --line: #dfe4ec; --accent: #2b6cb0; --ok: #2f855a; --bad: #c53030;
      --bad-bg: #fff5f5; --ok-bg: #f0fff4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827; --card: #1f2937; --text: #e5e7eb; --muted: #9ca3af;
        --line: #374151; --accent: #63b3ed; --ok: #68d391; --bad: #fc8181;
        --bad-bg: #3b1d1d; --ok-bg: #1c3327;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .lead { color: var(--muted); margin: 0 0 24px; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 10px; padding: 20px; margin-bottom: 16px;
    }
    .drop {
      border: 2px dashed var(--line); border-radius: 10px; padding: 28px;
      text-align: center; cursor: pointer; transition: border-color .15s;
    }
    .drop:hover, .drop.over { border-color: var(--accent); }
    .drop input { display: none; }
    .drop strong { color: var(--accent); }
    .hint { color: var(--muted); font-size: .9rem; margin-top: 8px; }
    button {
      margin-top: 16px; width: 100%; padding: 12px; font-size: 1rem;
      border: 0; border-radius: 8px; background: var(--accent); color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    .error {
      background: var(--bad-bg); color: var(--bad); border-radius: 8px;
      padding: 12px 14px; margin-bottom: 16px; display: none;
    }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .stat { text-align: center; padding: 14px 8px; border-radius: 8px; background: var(--bg); }
    .stat b { display: block; font-size: 1.8rem; }
    .stat span { color: var(--muted); font-size: .85rem; }
    .good b { color: var(--ok); }
    .bad b { color: var(--bad); }
    table { width: 100%; border-collapse: collapse; margin-top: 4px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
    th { font-size: .85rem; color: var(--muted); font-weight: 600; }
    .allgood { background: var(--ok-bg); color: var(--ok); padding: 12px; border-radius: 8px; }
    .hidden { display: none; }
    @media (max-width: 480px) {
      .summary { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<main>
  <h1>Data Quality Checker</h1>
  <p class="lead">Upload a CSV of survey records to find missing fields, bad coordinates and duplicate IDs.</p>

  <form id="form" class="card">
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".csv,text/csv">
      <div id="label"><strong>Choose a CSV file</strong> or drop it here</div>
      <div class="hint">Required columns: record_id, name, district, latitude, longitude</div>
    </label>
    <button id="submit" type="submit" disabled>Check file</button>
  </form>

  <div id="error" class="error" role="alert"></div>

  <section id="results" class="hidden">
    <div class="card">
      <div class="summary">
        <div class="stat"><b id="rows">0</b><span>rows in file</span></div>
        <div class="stat good"><b id="clean">0</b><span>clean rows</span></div>
        <div class="stat bad"><b id="issueCount">0</b><span>problems found</span></div>
      </div>
    </div>
    <div class="card" id="issuesCard">
      <h2 style="font-size:1.1rem;margin:0 0 8px">Problems</h2>
      <div id="allgood" class="allgood hidden">No problems found. Every row passed.</div>
      <table id="issuesTable" class="hidden">
        <thead><tr><th>Row</th><th>Column</th><th>Problem</th></tr></thead>
        <tbody id="issues"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
  const form = document.getElementById("form");
  const fileInput = document.getElementById("file");
  const drop = document.getElementById("drop");
  const label = document.getElementById("label");
  const submit = document.getElementById("submit");
  const errorBox = document.getElementById("error");
  const results = document.getElementById("results");

  function setFile(file) {
    if (!file) return;
    label.innerHTML = "";
    const name = document.createElement("strong");
    name.textContent = file.name;
    label.append(name, " selected");
    submit.disabled = false;
  }

  fileInput.addEventListener("change", () => setFile(fileInput.files[0]));

  ["dragenter", "dragover"].forEach(evt =>
    drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(evt =>
    drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => {
    const file = e.dataTransfer.files[0];
    if (file) {
      const dt = new DataTransfer();
      dt.items.add(file);
      fileInput.files = dt.files;
      setFile(file);
    }
  });

  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = "block";
    results.classList.add("hidden");
  }

  function cell(text) {
    const td = document.createElement("td");
    td.textContent = text;
    return td;
  }

  function showResults(data) {
    document.getElementById("rows").textContent = data.rows;
    document.getElementById("clean").textContent = data.clean_rows;
    document.getElementById("issueCount").textContent = data.issues.length;

    const body = document.getElementById("issues");
    body.innerHTML = "";
    data.issues.forEach(issue => {
      const tr = document.createElement("tr");
      tr.append(cell(issue.row ?? "-"), cell(issue.column ?? "-"), cell(issue.problem));
      body.append(tr);
    });

    const none = data.issues.length === 0;
    document.getElementById("allgood").classList.toggle("hidden", !none);
    document.getElementById("issuesTable").classList.toggle("hidden", none);
    results.classList.remove("hidden");
    results.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const file = fileInput.files[0];
    if (!file) return;

    errorBox.style.display = "none";
    submit.disabled = true;
    submit.textContent = "Checking...";

    const body = new FormData();
    body.append("file", file);

    try {
      const response = await fetch("/validate", { method: "POST", body });
      const data = await response.json();
      if (!response.ok) {
        showError(data.detail || "The file could not be checked.");
      } else {
        showResults(data);
      }
    } catch (err) {
      showError("Could not reach the server. Check that it is running and try again.");
    } finally {
      submit.disabled = false;
      submit.textContent = "Check file";
    }
  });
</script>
</body>
</html>
